<!DOCTYPE html>
<html>
<head>
    <title>Counter App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f4;
        }

        h1 {
            font-size: 50px;
            color: blue;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>Counter App</h2>

    <h1 id="count">0</h1>

    <button onclick="increase()">+1</button>
    <button onclick="decrease()">-1</button>
    <button onclick="reset()">Reset</button>

    <script>
        let count = 0;

        function increase() {
            count++;
            document.getElementById("count").innerHTML = count;
        }

        function decrease() {
            count--;
            document.getElementById("count").innerHTML = count;
        }

        function reset() {
            count = 0;
            document.getElementById("count").innerHTML = count;
        }
    </script>

</body>
</html>
